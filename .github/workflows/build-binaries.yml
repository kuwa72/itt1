name: Build Binaries

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
        python-version: [ '3.11' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          # macOS does not support pywin32
          pip install pydantic
          pip install pyinstaller

      - name: Show versions
        run: |
          python --version
          pip --version
          pyinstaller --version

      - name: Build with PyInstaller (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          pyinstaller --noconfirm --onefile --windowed --name iTunesController main.py

      - name: Build with PyInstaller (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          pyinstaller --noconfirm --onefile --windowed --name iTunesController main.py

      - name: Upload artifact (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: iTunesController-windows
          path: dist/iTunesController.exe

      - name: Upload artifact (macOS)
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: iTunesController-macos
          path: dist/iTunesController

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: iTunesController-windows
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: iTunesController-macos
          path: artifacts/macos

      - name: Prepare release files (zip)
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release
          # Windows zip
          cd artifacts/windows
          zip -9 ../../release/iTunesController-windows-${TAG}.zip iTunesController.exe
          cd -
          # macOS zip (preserve exec bit)
          cd artifacts/macos
          chmod +x iTunesController || true
          zip -9 ../../release/iTunesController-macos-${TAG}.zip iTunesController
          cd -

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/iTunesController-windows-${{ github.ref_name }}.zip
            release/iTunesController-macos-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
