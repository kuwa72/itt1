name: Build Binaries

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
        python-version: [ '3.11' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          pip install -r requirements.txt
          pip install -r requirements-windows.txt
          pip install pyinstaller

      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          # macOS does not support pywin32
          pip install pydantic
          pip install pyinstaller

      - name: Show versions
        run: |
          python --version
          pip --version
          pyinstaller --version

      - name: Build with PyInstaller (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          pyinstaller --noconfirm --onefile --windowed --name iTunesController main.py

      - name: Build with PyInstaller (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          pyinstaller --noconfirm --onefile --windowed --name iTunesController main.py

      - name: Upload artifact (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: iTunesController-windows
          path: dist/iTunesController.exe

      - name: Upload artifact (macOS)
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: iTunesController-macos
          path: dist/iTunesController

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 注: ここで作成するタグは GITHUB_TOKEN で push するため、
      # GitHub の仕様により本ワークフローを再トリガーしない（無限ループにならない）。
      - name: Create and push tag (if not tagged)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v0.0.0")
          NEW_TAG=$(echo "$LATEST_TAG" | awk -F. '{print $1"."$2"."$3+1}')
          # 既存タグと衝突する場合はパッチを進めて空きを探す
          while git rev-parse "$NEW_TAG" >/dev/null 2>&1; do
            NEW_TAG=$(echo "$NEW_TAG" | awk -F. '{print $1"."$2"."$3+1}')
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "TAG_NAME=$NEW_TAG" >> $GITHUB_ENV

      - name: Set tag name (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "TAG_NAME=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: iTunesController-windows
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: iTunesController-macos
          path: artifacts/macos

      - name: Prepare release files (zip)
        run: |
          set -euxo pipefail
          TAG="${TAG_NAME}"
          mkdir -p release
          # Windows zip
          cd artifacts/windows
          zip -9 ../../release/iTunesController-windows-${TAG}.zip iTunesController.exe
          cd -
          # macOS zip (preserve exec bit)
          cd artifacts/macos
          chmod +x iTunesController || true
          zip -9 ../../release/iTunesController-macos-${TAG}.zip iTunesController
          cd -

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            release/iTunesController-windows-${{ env.TAG_NAME }}.zip
            release/iTunesController-macos-${{ env.TAG_NAME }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
